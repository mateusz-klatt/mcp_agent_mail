# Example Apache 2.4 vhost — copy to /etc/apache2/sites-available/<your-domain>.conf
#
# MCP Agent Mail — https://agentmail.example.com -> 127.0.0.1:8765 (container mcp-agent-mail)
#
# Streaming-safe reverse proxy for the MCP Streamable-HTTP transport.
# Cert: certbot, authenticator=webroot, webroot_path=/var/lib/letsencrypt.
#
# Install:
#   sudo cp deploy/apache-agentmail.example.com.conf /etc/apache2/sites-available/agentmail.example.com.conf
#   sudo a2ensite agentmail.example.com && sudo apachectl configtest && sudo systemctl reload apache2
#
# Required modules (all already enabled on this host):
#   proxy, proxy_http, ssl, headers, rewrite
# mod_proxy_wstunnel is NOT needed — the app disables websockets (cli.py: ws="none").
# mod_proxy_http2 is NOT needed and must not be used for the backend hop.

# Deliberately omit query strings and Referer. OAuth callbacks carry a one-time
# authorization code and state in the query, so Apache's stock `combined`
# format would persist credentials in the access log.
LogFormat "%a %l %u %t \"%m %U %H\" %>s %b \"%{User-Agent}i\"" agentmail_safe

<VirtualHost *:80>
    ServerName agentmail.example.com

    ErrorLog  ${APACHE_LOG_DIR}/agentmail_error.log
    CustomLog ${APACHE_LOG_DIR}/agentmail_access.log agentmail_safe

    # ACME challenge (Certbot webroot)
    Alias /.well-known/acme-challenge/ "/var/lib/letsencrypt/.well-known/acme-challenge/"
    <Directory "/var/lib/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/ [NC]
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName agentmail.example.com

    ErrorLog  ${APACHE_LOG_DIR}/agentmail_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/agentmail_ssl_access.log agentmail_safe

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/agentmail.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/agentmail.example.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    # DENY rather than SAMEORIGIN: nothing here is meant to be framed, and the
    # /mail UI carries destructive POSTs (delete-messages, retire-agent,
    # archive-project, overseer/send).
    Header always set X-Frame-Options "DENY"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On

    # Strip whatever the client sent, then assert the truth ourselves.
    #
    # This is load-bearing for authentication, not cosmetics: the app grants an
    # unauthenticated bypass to requests whose peer address is loopback, and every
    # request arriving from this proxy IS loopback. The bypass self-disables only
    # when it sees an X-Forwarded-* / Forwarded header (http.py:731). The container
    # additionally sets HTTP_ALLOW_LOCALHOST_UNAUTHENTICATED=false so auth does not
    # rest on this alone — belt and braces, deliberately.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset Forwarded
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Forwarded-Host
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"

    # NOTE: if this domain is proxied by Cloudflare, %{REMOTE_ADDR} is a
    # Cloudflare edge address, not the visitor. Production OAuth requires rate
    # limiting, so configure the limit at Cloudflare OR enable mod_remoteip with
    # CF-Connecting-IP and Cloudflare's published ranges as RemoteIPTrustedProxy.
    # Otherwise all visitors share one backend bucket and can deny one another.

    # Browser OAuth endpoints accept only small requests and must never be
    # cached. The 8 KiB edge limit applies before the app parses DCR/form data.
    <LocationMatch "^/(authorize|token|register|consent|auth/callback)$">
        LimitRequestBody 8192
        Header always set Cache-Control "no-store"
        Header always set Pragma "no-cache"
    </LocationMatch>

    # ACME on 443 too (defensive), never proxied.
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ "/var/lib/letsencrypt/.well-known/acme-challenge/"
    <Directory "/var/lib/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # /health/* and /api/health bypass bearer auth inside the app (http.py:703),
    # and /health/readiness can echo internal exception text, paths and FD/lock
    # telemetry on failure (http.py:1605). The app matches by PREFIX, so any future
    # /health/* route is exposed too. The container's own HEALTHCHECK runs on
    # 127.0.0.1 inside the container and is unaffected by this denial.
    <LocationMatch "^/(health(/|$)|api/health$)">
        Require all denied
    </LocationMatch>

    # Single backend process, so Mcp-Session-Id affinity is automatic — stateful
    # MCP sessions live in an in-process manager (http.py:1446) and agent bindings
    # in in-process dicts (app.py:5039). Never scale this to multiple workers.
    #
    # timeout=3600: MCP Streamable HTTP holds a long-lived text/event-stream GET
    # open on /mcp. This is the idle backend I/O timeout, not a cap on request
    # duration. The server pings roughly every 15s, which also keeps Cloudflare's
    # ~100s idle timeout from firing a 524.
    # retry=0: never park the worker in an error state after a container restart.
    #
    # Deliberately NOT set:
    #   flushpackets=on  -- mod_proxy honours it only for AJP/FCGI/SCGI/uwsgi, not
    #                       for an http:// backend, where it is inert. mod_proxy_http
    #                       already forwards brigades as they arrive. (The hestia
    #                       vhost carries it; it is a no-op there too.)
    #   force-proxy-request-1.0 -- would break chunked streaming. mod_proxy_http
    #                       speaks HTTP/1.1 to the backend by default.
    #   Transfer-Encoding / Content-Encoding -- hop-by-hop headers; uvicorn and
    #                       Apache each frame chunked responses themselves.
    #                       mod_deflate is not enabled here, so nothing compresses
    #                       the event stream.
    ProxyPass        "/" "http://127.0.0.1:8765/" timeout=3600 retry=0
    ProxyPassReverse "/" "http://127.0.0.1:8765/"

    <Proxy *>
        Require all granted
    </Proxy>
</VirtualHost>
</IfModule>
