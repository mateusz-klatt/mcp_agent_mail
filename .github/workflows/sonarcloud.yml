name: SonarCloud

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

concurrency:
  # The caller serializes the complete CI workflow per ref.  Keep this reusable
  # workflow exact-SHA scoped as defense in depth for any future caller, and use
  # the freshness check below to reject a commit that stopped being HEAD while
  # its tests were running.
  group: sonarcloud-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scan:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          # Sonar attributes issues to commits; a shallow clone makes every line
          # look like it was written by whoever last pushed.
          fetch-depth: 0

      # Matrix runs on main are deliberately not cancelled. Before analysing,
      # reject an older run that completed after a newer commit reached the ref.
      - name: Check that this commit is still current
        id: freshness
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          REMOTE_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
        run: |
          set -euo pipefail
          # Annotated tags have both a tag-object SHA and a peeled commit SHA.
          # GitHub exposes the tagged commit as github.sha, so prefer ^{} when
          # present and fall back to the direct ref for branches/lightweight tags.
          current_sha="$(
            git ls-remote origin "$REMOTE_REF" "${REMOTE_REF}^{}" |
              awk '$2 ~ /\^\{\}$/ { peeled = $1 } NR == 1 { direct = $1 } END { print (peeled ? peeled : direct) }'
          )"
          if [[ -z "$current_sha" ]]; then
            echo "::error::Unable to resolve $REMOTE_REF on origin"
            exit 1
          fi
          if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale SonarCloud analysis for $EXPECTED_SHA; $REMOTE_REF is now $current_sha"
          fi

      - name: Download exact unit-test coverage
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-${{ github.sha }}

      - name: Verify coverage report
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: test -s coverage.xml

      - name: Download exact frontend coverage
        if: steps.freshness.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage-${{ github.sha }}
          path: ui/coverage

      - name: Verify frontend coverage report
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: test -s ui/coverage/lcov.info

      - name: SonarCloud scan
        if: steps.freshness.outputs.current == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Quality gate
        if: steps.freshness.outputs.current == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
