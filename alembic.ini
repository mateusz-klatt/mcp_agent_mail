# Alembic configuration.
#
# There is deliberately no `sqlalchemy.url` here. `migrations/env.py` reads the
# URL from this project's Settings, so the database location has exactly one
# source of truth and cannot drift between the application and its migrations.
[alembic]
script_location = src/mcp_agent_mail/migrations
prepend_sys_path = src
path_separator = os
# Revision filenames sort chronologically and say what they do.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
