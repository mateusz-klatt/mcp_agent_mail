name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Four runs stacked in the queue this afternoon, each re-analysing a tree the
# next one superseded. Only the newest push is worth scanning.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, Type Check, Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Scoped to the Windows leg by the `experimental` flag the include sets below.
    # matrix.experimental is null on the four POSIX legs, so this is false there
    # and they still gate merges.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      # Load-bearing: without it, the Windows leg failing cancels the four POSIX
      # legs mid-run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Honor the requires-python floor (3.12) advertised in pyproject.toml
        # alongside the primary 3.14 target used for Docker/release.
        python-version: ['3.12', '3.14']
        include:
          # One leg, not a third column. What breaks on Windows in this
          # repository is path absoluteness, subprocess exec and case-folding —
          # none of which differ between 3.12 and 3.14, so a second Windows job
          # would buy a duplicate of the same failures at 45-90 minutes each.
          #
          # Expected red at first, and that is the point. 276 POSIX-shaped
          # project keys remain across 47 files, and home-win-1 measured what
          # one machine sees that the others cannot: three files converted,
          # 54 failures to 1, none of which ubuntu or macos reports as broken.
          # Until now that visibility depended on someone volunteering to look.
          - os: windows-latest
            python-version: '3.14'
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # Replaces a hand-rolled installer and a hand-rolled cache. The shell
      # installer and `~/.cache/uv` are both POSIX assumptions; the action
      # resolves both per platform.
      #
      # It also drops `.venv` from the cache, which the previous restore-keys
      # prefix could repopulate from a different Python patch build.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        shell: bash
        run: |
          uv sync --dev

      - name: Lint (ruff)
        shell: bash
        run: |
          uv run ruff check

      - name: Type check
        shell: bash
        run: |
          uvx ty check

      - name: Run tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run -m pytest -q

      - name: Smoke test am-run (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run python -m mcp_agent_mail.cli am-run ci-slot -- echo "ok"

      - name: Run performance benchmarks (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
          RUN_BENCHMARKS: "1"
          INSTRUMENTATION_ENABLED: "true"
        run: |
          uv run -m pytest tests/benchmarks/ -v -m benchmark --tb=short

      - name: CI Performance Regression Check (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run -m pytest tests/benchmarks/test_ci_regression.py -v -m ci_regression --tb=short

      - name: Upload regression report artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-py${{ matrix.python-version }}
          path: tests/benchmarks/regression_reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark results artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: tests/benchmarks/results/
          if-no-files-found: ignore
          retention-days: 30
