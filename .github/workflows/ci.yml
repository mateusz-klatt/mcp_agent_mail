name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Four runs stacked in the queue this afternoon, each re-analysing a tree the
# next one superseded. Only the newest push is worth scanning.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    # Deliberately NOT `needs: build-and-test`. That job currently stops at the
    # type-check gate, and a scanner chained behind it would stay silent for
    # exactly as long as the code most needs an outside opinion. This one speaks
    # on every push, pass or fail.
    #
    # It is also the only quality signal here that no agent working on this
    # repository configures: the linter's rule set, the type checker's settings
    # and the tests are all written by the same hands they judge.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar attributes issues to commits; a shallow clone makes every line
          # look like it was written by whoever last pushed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        shell: bash
        run: uv sync --dev

      - name: Tests with coverage
        shell: bash
        # continue-on-error, not `|| true`: the step is allowed to fail and the
        # failure stays visible in the run. `|| true` would report success and
        # hide which of the two happened.
        continue-on-error: true
        # Time-boxed, and that box is the point. The whole reason this job exists
        # is to give an opinion nobody here controls, promptly. Measured: the
        # first four runs all sat here and the scanner never spoke — the
        # independent judge had been queued behind the slowest thing in the
        # repository, which is the one place it must never be.
        #
        # Past the box the step is cut, the scan still runs, and Sonar analyses
        # the code without coverage. Losing a coverage number is cheap; losing
        # the analysis is not.
        timeout-minutes: 20
        env:
          PYTHONUTF8: "1"
        run: uv run -m pytest -q --cov=mcp_agent_mail --cov-report=xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          # SONAR_HOST_URL is what was missing: without it the action assumes a
          # self-hosted SonarQube, and four consecutive runs finished with the
          # SonarCloud project still reporting `status: NONE`. Copied from the
          # configuration in snapper-mcp, which has been producing analyses.
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Lets Sonar annotate pull requests instead of only the dashboard.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        # Reports the verdict without failing the run. The first analysis of a
        # fork whose upstream CI has not passed since June will not meet a gate,
        # and a red cross there would say nothing anyone can act on yet.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-test:
    name: Lint, Type Check, Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Honor the requires-python floor (3.12) advertised in pyproject.toml
        # alongside the primary 3.14 target used for Docker/release.
        python-version: ['3.12', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          uv --version

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ci-uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ci-uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Sync dependencies
        shell: bash
        run: |
          uv sync --dev

      - name: Lint (ruff)
        shell: bash
        run: |
          uv run ruff check

      - name: Type check
        shell: bash
        run: |
          uvx ty check

      - name: Run tests
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run -m pytest -q

      - name: Smoke test am-run (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run python -m mcp_agent_mail.cli am-run ci-slot -- echo "ok"

      - name: Run performance benchmarks (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
          RUN_BENCHMARKS: "1"
          INSTRUMENTATION_ENABLED: "true"
        run: |
          uv run -m pytest tests/benchmarks/ -v -m benchmark --tb=short

      - name: CI Performance Regression Check (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run -m pytest tests/benchmarks/test_ci_regression.py -v -m ci_regression --tb=short

      - name: Upload regression report artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-reports-py${{ matrix.python-version }}
          path: tests/benchmarks/regression_reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark results artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: tests/benchmarks/results/
          if-no-files-found: ignore
          retention-days: 30
