# SonarCloud runs only after the complete Python 3.14 platform matrix succeeds.
# Its coverage report is carried from the matching Ubuntu test job as a
# commit-specific workflow artifact.
sonar.projectKey=mateusz-klatt_mcp_agent_mail
sonar.organization=mateusz-klatt

# Named explicitly. The scan action targets a self-hosted SonarQube unless
# told otherwise, and this project is on SonarCloud — the omission is why
# four runs produced no analysis at all.
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.14

# CI uploads this report immediately after the complete unit-test run. The
# SonarCloud job verifies that it exists before starting the scanner.
sonar.python.coverage.reportPaths=coverage.xml

# Generated, vendored or fixture material: measuring it would move every number
# without changing anything a person could act on.
sonar.exclusions=**/templates/**,**/static/**,**/*.min.js,**/golden/**,docs/**
sonar.coverage.exclusions=tests/**,scripts/**,**/benchmarks/**

sonar.sourceEncoding=UTF-8
