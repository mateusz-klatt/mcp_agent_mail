# SonarCloud, wired to run on every push regardless of whether the build gate
# passes. That independence is the point: every other quality signal this
# project has — the linter's rule set, the type checker's configuration, the
# tests themselves — is written and tuned by the same agents whose work it
# judges. This one is not.
sonar.projectKey=mateusz-klatt_mcp_agent_mail
sonar.organization=mateusz-klatt

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12,3.14

# Coverage is imported when it exists and skipped silently when it does not.
# The test suite is not green yet, so early runs analyse code without coverage
# rather than failing for the lack of it — a scanner that refuses to speak until
# the suite is perfect gives its first opinion exactly when it is least needed.
sonar.python.coverage.reportPaths=coverage.xml

# Generated, vendored or fixture material: measuring it would move every number
# without changing anything a person could act on.
sonar.exclusions=**/templates/**,**/static/**,**/*.min.js,**/golden/**,docs/**
sonar.coverage.exclusions=tests/**,scripts/**,**/benchmarks/**
