# SonarCloud runs only after the Python 3.14 Ubuntu and frontend jobs succeed.
# Their coverage reports are carried from the matching jobs as commit-specific
# workflow artifacts.
sonar.projectKey=mateusz-klatt_mcp_agent_mail
sonar.organization=mateusz-klatt

# Named explicitly. The scan action targets a self-hosted SonarQube unless
# told otherwise, and this project is on SonarCloud — the omission is why
# four runs produced no analysis at all.
sonar.host.url=https://sonarcloud.io

sonar.sources=src,ui/src
sonar.tests=tests,ui/src
sonar.test.inclusions=tests/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,ui/src/test/**/*
sonar.python.version=3.14

# CI uploads this report immediately after the complete unit-test run. The
# SonarCloud job verifies that it exists before starting the scanner.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=ui/coverage/lcov.info

# Generated, vendored or fixture material: measuring it would move every number
# without changing anything a person could act on.
sonar.exclusions=**/templates/**,**/static/**,**/*.min.js,**/golden/**,docs/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,ui/src/test/**/*
sonar.coverage.exclusions=tests/**,scripts/**,**/benchmarks/**,ui/src/**/*.test.ts,ui/src/**/*.test.tsx,ui/src/test/**/*,ui/src/legacy.ts,ui/src/main.tsx,ui/src/vite-env.d.ts

# The locale dictionaries translate the word "password" — label strings for the
# login form, not credentials. S2068 cannot tell the difference.
#
# Every S5332 (clear-text http) flag in src is either a loopback default
# (HTTP_HOST=127.0.0.1, bearer-authenticated CLI→local-server calls), a
# startswith() classifier for git remote URL syntax, or a display-only URL in
# the startup banner. External exposure is fronted by operator-managed TLS
# termination; none of these sites reaches an external endpoint.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=ui/src/locales/**
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=src/mcp_agent_mail/**

# Parallel translation dictionaries are structurally identical by design;
# measuring their mutual duplication is noise.
sonar.cpd.exclusions=ui/src/locales/**

sonar.sourceEncoding=UTF-8
