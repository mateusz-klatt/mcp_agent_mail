name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

env:
  # ty is intentionally an isolated uv tool rather than a project dependency,
  # but its version is still part of the reproducible quality-gate contract.
  TY_VERSION: "0.0.71"

# Keep the whole main workflow, including its reusable Sonar job, serial per
# ref.  With cancellation disabled, the running commit is allowed to finish and
# GitHub retains the most recently queued pending run.  This prevents two branch
# analyses from racing while avoiding the former cancel-on-every-push starvation;
# the Sonar freshness check still rejects any queued commit that is no longer
# HEAD. Pull requests cancel a superseded run because only their latest head matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Lint, Type Check, Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      # Keep the Sonar dependency isolated to Ubuntu. Portability remains a
      # separate required matrix below, so its status stays visible without
      # delaying or suppressing analysis of Ubuntu's exact-SHA coverage.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Node.js 26.7.0 for distribution builds
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # Replaces a hand-rolled installer and a hand-rolled cache. The shell
      # installer and `~/.cache/uv` are both POSIX assumptions; the action
      # resolves both per platform.
      #
      # It also drops `.venv` from the cache, which the previous restore-keys
      # prefix could repopulate from a different Python patch build.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        shell: bash
        run: |
          uv sync --dev --frozen

      # Browser-level security and mobile-layout tests are part of the full
      # suite.  Installing Chromium here makes them a real Ubuntu gate instead
      # of an import-only test which silently skips in CI.
      - name: Install Chromium for browser UAT
        shell: bash
        run: |
          uv run playwright install --with-deps chromium

      - name: Lint (ruff)
        shell: bash
        run: |
          uv run ruff check

      - name: Type check
        shell: bash
        run: |
          uvx --from "ty==${TY_VERSION}" ty check --python-version 3.14 --python-platform all

      - name: Run full unit test suite
        shell: bash
        env:
          PYTHONUTF8: "1"
          # Only this job installs Chromium.  The viewer's browser UAT must be
          # a hard gate here, while macOS/Windows portability jobs remain
          # allowed to skip when a host browser is unavailable.
          AGENT_MAIL_BROWSER_UAT_REQUIRED: "1"
        run: |
          # A hard per-test ceiling turns silent multi-hour crawls and event-loop
          # deadlocks into named failures with thread dumps, and the durations
          # report ranks the offenders — without it a leg that exceeds the job
          # timeout is killed before pytest prints anything at all.
          uv run -m pytest -q --cov-report=xml:coverage.xml --timeout=300 --timeout-method=thread --durations=50

      - name: Run AgentExecution integration showcase
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run python scripts/integration_showcase.py

      # Freeze the full-suite report before the benchmark pytest invocations
      # below replace the active coverage data with their selected tests.
      - name: Upload unit-test coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Smoke test am-run (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run python -m mcp_agent_mail.cli am-run ci-slot -- echo "ok"

      - name: Run performance benchmarks (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
          RUN_BENCHMARKS: "1"
          INSTRUMENTATION_ENABLED: "true"
        run: |
          uv run -m pytest tests/benchmarks/bench_*.py -v -m benchmark --tb=short

      - name: CI Performance Regression Check (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          uv run -m pytest tests/benchmarks/test_ci_regression.py -v -m ci_regression --tb=short

      - name: Upload regression report artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-reports-py${{ matrix.python-version }}
          path: tests/benchmarks/regression_reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload benchmark results artifact
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results-py${{ matrix.python-version }}
          path: tests/benchmarks/results/
          if-no-files-found: ignore
          retention-days: 30

  frontend:
    name: Frontend lint, type check, test, and build (Node 26.7.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 26.7.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npm run typecheck

      - name: Run frontend tests with coverage
        run: npm run coverage

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage-${{ github.sha }}
          path: ui/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  frontend-webkit:
    name: Iris React WebKit UAT (Node 26.7.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 26.7.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # The exact @playwright/test version in package-lock.json pins the WebKit
      # revision. All application assets and API responses remain same-origin.
      - name: Install pinned Playwright WebKit
        run: ./node_modules/.bin/playwright install --with-deps webkit

      - name: Run Iris WebKit UAT
        run: npm run test:e2e:webkit

      - name: Upload WebKit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webkit-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/mcp-agent-mail-webkit-*
          if-no-files-found: warn
          retention-days: 7

  portability:
    name: Lint, Type Check, Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      # Both portability checks must report even if the other platform fails.
      fail-fast: false
      matrix:
        # Windows moved to `portability-windows` below, where it is split across
        # parallel runners.  macOS finishes the whole suite in ~18 minutes and is
        # billed at 10x, so splitting it would cost a lot and buy nothing.
        os: [macos-latest]
        python-version: ['3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Node.js 26.7.0 for distribution builds
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        shell: bash
        run: |
          uv sync --dev --frozen

      - name: Lint (ruff)
        shell: bash
        run: |
          uv run ruff check

      - name: Type check
        shell: bash
        run: |
          uvx --from "ty==${TY_VERSION}" ty check --python-version 3.14 --python-platform all

      - name: Run full unit test suite
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # Same per-test ceiling as the Ubuntu leg. On Windows the suite has
          # crawled at up to 32 s/test in the CLI band and been killed by the
          # job timeout with zero output; the ceiling plus durations report is
          # what makes those runs diagnosable at all.
          uv run -m pytest -q --no-cov --timeout=300 --timeout-method=thread --durations=50

  portability-windows:
    # The Windows leg needs ~4.5 h for the full suite where Ubuntu needs 19 min,
    # so it was killed by the ceiling at ~59% with no output whatsoever: a
    # failure in the first five minutes was as invisible as one in the last hour.
    # Splitting does not fix that 14x gap — it makes failures visible while the
    # gap is diagnosed, and `fail-fast: false` keeps every chunk reporting.
    name: Lint, Type Check, Test (windows-latest, py${{ matrix.python-version }}, chunk ${{ matrix.group }}/8)
    runs-on: windows-latest
    # `.test_durations` now exists, so pytest-split balances by measured time
    # rather than by test COUNT, and the chunks stop being wildly uneven: the
    # predicted spread is 23.8-25.1 min against the 13-50 min this leg actually
    # ran without the file.  The ceiling stays at 90 for one run — it is a
    # kill for a HANG, not a budget for slowness, and it is not worth risking a
    # red chunk on a predicted number the day after this leg first went green.
    # Drop it to 45 once a real run confirms the spread.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        group: [1, 2, 3, 4, 5, 6, 7, 8]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Node.js 26.7.0 for distribution builds
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        shell: bash
        run: |
          uv sync --dev --frozen

      # Lint and type check are platform-independent and already run on Ubuntu
      # and macOS.  Running them in all eight chunks would be pure duplication,
      # so chunk 1 carries them and keeps this job's name honest.
      - name: Lint (ruff)
        if: matrix.group == 1
        shell: bash
        run: |
          uv run ruff check

      - name: Type check
        if: matrix.group == 1
        shell: bash
        run: |
          uvx --from "ty==${TY_VERSION}" ty check --python-version 3.14 --python-platform all

      - name: Run unit test suite (chunk ${{ matrix.group }}/8)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # Same per-test ceiling as the Ubuntu leg.  --splits/--group come from
          # pytest-split; with a committed `.test_durations` it balances chunks
          # by measured time, and without one it falls back to equal test counts.
          uv run -m pytest -q --no-cov --timeout=300 --timeout-method=thread \
            --durations=50 --splits 8 --group ${{ matrix.group }}

  portability-windows-summary:
    # Deliberately carries the name the single Windows job used to have, so any
    # branch protection requiring that exact check keeps working after the split.
    name: Lint, Type Check, Test (windows-latest, py3.14)
    needs: [portability-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate chunk results
        shell: bash
        env:
          CHUNKS_RESULT: ${{ needs.portability-windows.result }}
        run: |
          # `needs.<job>.result` for a matrix job is the worst result across all
          # of its chunks, so this fails when any single chunk fails, is
          # cancelled, or is skipped.
          if [ "${CHUNKS_RESULT}" != "success" ]; then
            echo "::error::Windows chunks did not all pass (aggregate result: ${CHUNKS_RESULT})."
            exit 1
          fi
          echo "All 8 Windows chunks passed."

  sonar:
    name: SonarCloud
    needs: [build-and-test, frontend, frontend-webkit]
    permissions:
      contents: read
      pull-requests: read
    if: >-
      ${{
        needs.build-and-test.result == 'success' &&
        needs.frontend.result == 'success' &&
        needs.frontend-webkit.result == 'success' &&
        (
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
