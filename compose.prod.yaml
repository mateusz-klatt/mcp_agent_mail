# Production deployment.
#
# Deliberately a SEPARATE file from the repo's own compose.yaml / docker-compose.yml:
#   * compose.yaml (upstream) omits DATABASE_URL — see the note below; it loses the DB.
#   * docker-compose.yml (upstream) points at Postgres, which this app rejects at startup
#     (db.py, `_SUPPORTED_BACKENDS = frozenset({"sqlite"})`). It is dead on arrival.
# Keeping ours separate also keeps `git merge upstream/main` conflict-free.
#
#   docker compose -f compose.prod.yaml up -d --build
#
services:
  mcp-agent-mail:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-agent-mail:local
    container_name: mcp-agent-mail

    init: true                # tini as PID1: reap zombies + forward SIGTERM
    restart: unless-stopped
    stop_grace_period: 30s    # let SQLite checkpoint the WAL and the git commit queue drain

    # Loopback ONLY. Apache on the host is the sole ingress; the container must never
    # be reachable from the LAN, because BearerAuthMiddleware lets any path starting
    # with /health/ (and /api/health) through unauthenticated.
    ports:
      - "127.0.0.1:8765:8765"

    # Secrets (HTTP_BEARER_TOKEN, MAIL_UI_SESSION_SECRET) — gitignored, mode 0600.
    env_file:
      - .env

    environment:
      HTTP_HOST: "0.0.0.0"    # inside the container only; the port bind above confines it
      HTTP_PORT: "8765"

      # MUST stay "/api/". build_http_app always mounts a "/mcp" alias, and per #250
      # (ec835d2) "/mcp" gets the STATEFUL app *unless* /mcp is itself the configured
      # base — an explicit HTTP_PATH=/mcp/ would silently downgrade it to stateless.
      # So: /api/ = stateless one-shot, /mcp = stateful (issues Mcp-Session-Id).
      HTTP_PATH: "/api/"

      STORAGE_ROOT: "/data/mailbox"

      # ---------------------------------------------------------------------
      # THE most important line in this file.
      #
      # The DATABASE_URL default is "sqlite+aiosqlite:///./storage.sqlite3" — a
      # RELATIVE path, resolved against the process CWD by `.resolve()` in db.py,
      # and the image's WORKDIR is /app (not a volume). Leaving it unset puts the
      # database at /app/storage.sqlite3 inside the container's writable layer, so
      # `docker compose down && up` destroys every message, agent, thread and
      # reservation — while the git archive under /data survives and makes the loss
      # look like it didn't happen.
      #
      # Four slashes = absolute path. db.py's own "unsupported backend" error text
      # suggests exactly this value.
      # ---------------------------------------------------------------------
      DATABASE_URL: "sqlite+aiosqlite:////data/mailbox/storage.sqlite3"

      # Auth. Without a bearer the whole server is open; with one, only OPTIONS,
      # /health/* and /api/health stay unauthenticated (BearerAuthMiddleware).
      HTTP_ALLOW_LOCALHOST_UNAUTHENTICATED: "false"   # default is TRUE; behind a proxy the
                                                      # bypass self-disables only because Apache
                                                      # sends X-Forwarded-* and
                                                      # BearerAuthMiddleware._has_forwarded_headers
                                                      # then refuses to trust the localhost check.
                                                      # Do not leave security resting on header
                                                      # hygiene.
      HTTP_JWT_ENABLED: "false"

      # RBAC defaults to enabled with default role "reader" (settings.http.rbac_enabled,
      # rbac_default_role). With JWT off, EVERY remote request gets that role, and any
      # tools/call outside the read-only whitelist (settings.http.rbac_readonly_tools —
      # health_check, fetch_inbox, whois, search_messages, summarize_thread) is rejected
      # 403 — send_message included.
      # A remote agent with a perfectly valid bearer would be silently read-only.
      HTTP_RBAC_ENABLED: "true"
      HTTP_RBAC_DEFAULT_ROLE: "writer"

      # APP_ENVIRONMENT defaults to "development", and HTTP_CORS_ENABLED defaults to
      # `environment == "development"` — so leaving APP_ENVIRONMENT unset turns CORS ON.
      APP_ENVIRONMENT: "production"
      HTTP_CORS_ENABLED: "false"

      # Attachments must not be readable from arbitrary host paths.
      ALLOW_ABSOLUTE_ATTACHMENT_PATHS: "false"

      # Long-running central server: reap expired file reservations instead of
      # letting them accumulate (defaults to off, which suits a laptop, not a daemon).
      FILE_RESERVATIONS_CLEANUP_ENABLED: "true"
      FILE_RESERVATIONS_CLEANUP_INTERVAL_SECONDS: "60"

      # Attribution for the git archive commits.
      GIT_AUTHOR_NAME: "agent-mail"
      GIT_AUTHOR_EMAIL: "agent-mail@localhost"

    volumes:
      # Everything durable lives here: storage.sqlite3 (+ -wal/-shm), the git archive,
      # attachments, and the server lock. Host dir must be owned by uid/gid 10001 —
      # the Dockerfile's chown happens at build time and is shadowed by this mount.
      - type: bind
        source: ./data
        target: /data

      # Backup destination, deliberately OUTSIDE this git working tree.
      # ./data is gitignored-and-untracked, which is exactly what `git clean -xdf`
      # deletes — so an off-tree copy is what makes that survivable. The container
      # writes the SQLite snapshot here directly (VACUUM INTO), because a hot WAL
      # database cannot be safely backed up with a plain host-side `cp`.
      # Path comes from AGENT_MAIL_BACKUP_DIR in the project's .env (gitignored):
      # this repository is public and must not name a machine or a user.
      # The directory must be owned by uid 10001 — the container writes to it.
      - type: bind
        source: ${AGENT_MAIL_BACKUP_DIR:?set AGENT_MAIL_BACKUP_DIR in .env}
        target: /backup

    security_opt:
      - "no-new-privileges:true"

    # NOTE: single process, deliberately — a correctness requirement, not a
    # capacity choice. Four things live only in the memory of the process that
    # created them, so a second worker does not halve the load, it halves the
    # chance of finding the state:
    #
    #   StreamableHTTPSessionManager   stateful MCP sessions
    #   session_agent_bindings         which agent a session speaks as
    #   NotificationHub subscribers    the fan-out behind /events
    #   _login_failures                the login brute-force throttle
    #
    # Every one of them fails intermittently and silently under more than one
    # worker: a session initialised in worker A is unknown in worker B, an
    # /events client parked on B never sees a hint published on A, and a throttle
    # of 8 attempts per window becomes 8 per window per worker.
    #
    # The image's default CMD is single-process uvicorn — correct. Switching to
    # deploy/gunicorn.conf.py is safe only while that file keeps workers = 1, and
    # adding -w/--workers to any of these commands breaks the invariant with no
    # warning and no log line.
    #
    # Symbol names, not file:line. A line number that has drifted onto unrelated
    # code invites the next reader to dismiss the whole note as stale, including
    # the half that still holds.
