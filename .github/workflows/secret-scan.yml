name: Secret scan

# Scans the whole history, and that is the entire substance of this file.
#
# The first version used gitleaks-action's defaults and reported "no leaks
# found" in 147 milliseconds. It had scanned 1.16 KB — the push diff — of a
# repository with 991 commits and 10 MB of history. A full scan finds six, all
# inherited from upstream, all still reachable in a public fork.
#
# `fetch-depth: 0` is necessary and was not sufficient: having the history on
# disk does not make the scanner look at it.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.18.4"
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      - name: Verify scanner canary
        shell: bash
        run: |
          set +e
          printf 'token=%s%s\n' 'ghp_' '1234567890abcdefghijklmnopqrstuvwxyz' | \
            gitleaks detect --pipe --redact --no-banner \
              --report-format json --report-path "$RUNNER_TEMP/gitleaks-canary.json"
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "::error::Gitleaks failed to reject its synthetic GitHub-token canary"
            exit 1
          fi
          jq -e 'map(select(.RuleID == "github-pat")) | length == 1' \
            "$RUNNER_TEMP/gitleaks-canary.json" >/dev/null

      - name: Gate the exact checked-out tree
        shell: bash
        run: |
          gitleaks detect --no-git --source . \
            --redact --no-banner \
            --report-format sarif --report-path gitleaks-current-tree.sarif

      - name: Scan full history
        shell: bash
        # `--log-opts=--all --full-history` is what the action's default does not
        # do. Measured locally: 991 commits, 10.22 MB, 5.2 s, six findings.
        #
        # Not failing the build yet: the six are inherited from before this fork
        # existed and are not ours to rotate in a CI run. The report is uploaded
        # and the count is printed; turning this into a gate is a separate
        # decision, taken once the inherited set is dealt with.
        continue-on-error: true
        run: |
          gitleaks detect --source . \
            --log-opts="--all --full-history" \
            --redact --no-banner \
            --report-format json --report-path gitleaks.json || true
          echo "findings: $(jq 'length' gitleaks.json 2>/dev/null || echo unknown)"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: |
            gitleaks-current-tree.sarif
            gitleaks.json
          if-no-files-found: ignore
          retention-days: 30
