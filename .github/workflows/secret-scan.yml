name: Secret scan

# The gap this closes was documented by our own commit history: a bearer token
# removed from the working tree this morning is still reachable in seven commits
# of a public repository. It is dead — measured, /healthz answers 401 with it and
# 404 with the live one, so it authenticates no longer — and nothing here would
# have caught the next one.
#
# It was found by an agent reading that file for an unrelated reason. That is not
# a process.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole point. A shallow clone scans the working tree, which is
          # exactly where this morning's token was NOT — it was in the history.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
