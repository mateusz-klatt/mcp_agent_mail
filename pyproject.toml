[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-agent-mail"
version = "0.5.0"
description = "Iris: coordinated multi-agent messaging and coordination MCP server."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# NOT plain MIT, and the distinction is load-bearing. LICENSE is "MIT License
# (with OpenAI/Anthropic Rider)": the rider withholds all rights from a named
# set of parties and terminates permission on breach. A licence that
# discriminates against specific persons or groups is not OSI-approved, so
# declaring `text = "MIT"` with the OSI MIT classifier misstated the terms.
# Point at the file instead of restating terms that do not fit any SPDX id.
license = { file = "LICENSE" }
authors = [
  { name = "mcp-agent-mail maintainers" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp>=2.10.5",
  "uvicorn[standard]>=0.32.0",
  "fastapi>=0.110.0",
  "PyYAML>=6.0.2",
  "pathspec>=0.12.1",
  "jinja2>=3.1.4",
  "markdown2>=2.4.12",
  "bleach>=6.1.0",
  "tinycss2>=1.4.0",
  "python-decouple>=3.8",
  "sqlmodel>=0.0.16",
  "sqlalchemy[asyncio]>=2.0.35",
  "aiosqlite>=0.20.0",
  "httpx[http2]>=0.27.2",
  # Not imported anywhere in this package. litellm loads it at runtime when
  # the LLM cache backend is set to "redis" (see llm.py, `LiteLLMCacheType.
  # REDIS`), so dropping it would break that backend with an import error
  # far from here.
  "redis[hiredis]>=5.3.0",
  "rich>=13.9.1",
  "typer>=0.15.0",
  "structlog>=24.1.0",
  "orjson>=3.10.7,<4",
  "pillow>=10.4.0",
  "GitPython>=3.1.43",
  "filelock>=3.16.0",
  "authlib>=1.5.2,<1.6",
  "litellm>=1.40.0,<2",
  "ruff>=0.14.1,<0.15",
  "pynacl>=1.6.0",
  "psutil>=6.1.1",
  "alembic>=1.19.1",
  "py-key-value-aio[disk,wrappers-encryption]>=0.2.8,<0.3",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.30.0",
]
dev = [
  "ruff>=0.5.7,<0.15",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "ipython>=8.27.0",
]

[project.urls]
Homepage = "https://github.com/mateusz-klatt/mcp_agent_mail"
Repository = "https://github.com/mateusz-klatt/mcp_agent_mail"
Issues = "https://github.com/mateusz-klatt/mcp_agent_mail/issues"
Upstream = "https://github.com/Dicklesworthstone/mcp_agent_mail"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_agent_mail"]
exclude = [
    "/src/mcp_agent_mail/viewer_assets/vendor/clusterize.min.css",
    "/src/mcp_agent_mail/viewer_assets/vendor/clusterize.min.js",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.git",
    "/.idea",
    "/.mypy_cache",
    "/.playwright-mcp",
    "/.pytest_cache",
    "/.ruff_cache",
    "/.venv",
    "/.vscode",
    "/__pycache__",
    "/htmlcov",
    "/ui/coverage",
    "/ui/dist",
    "/ui/node_modules",
    "/src/mcp_agent_mail/viewer_assets/vendor/clusterize.min.css",
    "/src/mcp_agent_mail/viewer_assets/vendor/clusterize.min.js",
    "*.db*",
    "*.py[cod]",
    ".DS_Store",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "B",
  "I",
  "C4",
  "ASYNC",
  "A",
  "RUF",
  "SIM",
  "PTH",
  "FA",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_agent_mail"]
combine-as-imports = true

# There is deliberately no [tool.mypy] section. This project type-checks with
# `ty` (pinned in .github/workflows/ci.yml and the Makefile, run as
# `ty check --python-version 3.14 --python-platform all`), and that is the only
# type checker in the gate.
#
# A `[tool.mypy]` block declaring `disallow_untyped_defs` and friends used to
# live here while nothing ever invoked mypy -- not CI, not `make typecheck`,
# not a pre-commit hook. Configuration that looks like a guarantee and enforces
# nothing is worse than no configuration: it invites a reader to assume a
# standard the code has never been held to. Run two checkers or one, but do not
# advertise a second one that never runs.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--strict-markers",
  "--cov=mcp_agent_mail",
  "--cov-report=term-missing",
]
pythonpath = ["src"]
filterwarnings = [
  "ignore:coroutine 'FastMCP.get_tool' was never awaited:RuntimeWarning",
  "ignore:Exception in thread:pytest.PytestUnhandledThreadExceptionWarning",
  "ignore:Event loop is closed:RuntimeWarning",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "benchmark: marks tests as performance benchmarks",
  "ci_regression: marks tests for CI performance regression checking",
]

[dependency-groups]
dev = [
    "hatchling==1.32.0",
    "playwright==1.62.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    # Splits the Windows leg across parallel runners.  That leg needs ~4.5 h for
    # the full suite while Ubuntu needs 19 min, so it was being killed by the
    # 180-minute ceiling at ~59% having printed nothing at all — failures in the
    # first five minutes were as invisible as failures in the last hour.
    "pytest-split>=0.10.0",
    "pytest-timeout>=2.4.0",
]
